  from = "/downloads/BlankDelay-Blank-Premium-Utility-Setup.exe"
  to = "/downloads/BlankDelay-Setup.exe"
  status = 302
  force = true
[[redirects]]
  from = "/downloads/BlankDelay-Zero-Delay-Plus-Setup.exe"
  to = "/downloads/BlankDelay-Setup.exe"
  status = 302
  force = true
[[redirects]]
  from = "/downloads/BlankDelay-Zero-Delay-Setup.exe"
  to = "/downloads/BlankDelay-Setup.exe"
  status = 302
  force = true
[[redirects]]
  from = "/downloads/BlankDelay-FPS-Boost-Setup.exe"
  to = "/downloads/BlankDelay-Setup.exe"
  status = 302
  force = true
[[redirects]]
  from = "/downloads/BlankDelay-Ping-Optimizer-Setup.exe"
  to = "/downloads/BlankDelay-Setup.exe"
