<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Blank Delay — premium PC optimization and hardware macros. Zero Delay. Infinite Advantage." />
    <meta property="og:title" content="BLANK DELAY — Zero Delay. Infinite Advantage." />
    <meta property="og:description" content="FPS Boost, kernel tweaks, zero delay controller and keyboard macros." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/Blank%20Delay%20Logo.png" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
    <title>BLANK DELAY — Zero Delay. Infinite Advantage.</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        transition: opacity 0.4s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .mark {
        width: 18px;
        height: 18px;
        margin: 0 auto 16px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 24px #fff;
      }
      #boot p {
        margin: 0;
        font: 700 13px/1 Inter, system-ui, sans-serif;
        letter-spacing: 0.28em;
      }
      #boot .bar {
        width: 140px;
        height: 2px;
        margin: 18px auto 0;
        overflow: hidden;
        background: rgba(255,255,255,0.15);
      }
      #boot .bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #fff;
        animation: boot 0.9s ease-in-out infinite;
      }
      @keyframes boot {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div>
        <div class="mark"></div>
        <p>BLANK DELAY</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
