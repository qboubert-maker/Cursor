<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlankDelay Product Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">BLANKDELAY</div>
    <div class="tag">Product Hub · Test keys · Downloads</div>
  </header>

  <main>
    <section class="hero">
      <h1>Delay? We Left That <span>BLANK</span>.</h1>
      <p>Open any product, grab a test key, or simulate a purchase email.</p>
    </section>

    <section class="tools cardish">
      <h2>Key tester</h2>
      <div class="row">
        <input id="keyInput" placeholder="PASTE-LICENSE-KEY" />
        <button id="validateBtn">Validate</button>
        <button id="redeemBtn" class="ghost">Redeem</button>
      </div>
      <pre id="keyResult">Enter a key to validate.</pre>
    </section>

    <section class="tools cardish">
      <h2>Admin test fulfill (sends email if SMTP set)</h2>
      <div class="row">
        <input id="adminToken" placeholder="Admin token" />
        <input id="testEmail" placeholder="buyer@email.com" />
        <select id="testProduct"></select>
        <button id="fulfillBtn">Generate key + email</button>
      </div>
      <pre id="fulfillResult">Uses POST /api/admin/fulfill</pre>
    </section>

    <section>
      <h2 class="section-title">Products</h2>
      <div id="products" class="grid"></div>
    </section>
  </main>

  <footer>
    Discord: <a href="https://discord.gg/cJafcE7y5W" target="_blank" rel="noreferrer">discord.gg/cJafcE7y5W</a>
  </footer>
  <script src="hub.js"></script>
</body>
</html>
