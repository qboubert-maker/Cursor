<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blank Premium Utility</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .app {
      max-width: 520px;
      margin: 40px auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    }
    .app h1 { margin: 0 0 6px; font-size: 1.6rem; }
    .app .sub { color: var(--muted); margin: 0 0 22px; }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .status.ok { border-color: rgba(109,255,176,0.5); color: var(--accent2); }
    .status.bad { border-color: rgba(255,93,108,0.5); color: #ff8b96; }
    .back { display: inline-block; margin: 18px 28px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <a class="back" href="/hub/">← Product Hub</a>
  <div class="app">
    <div class="brand" style="margin-bottom:10px">BLANKDELAY</div>
    <h1>Blank Premium Utility</h1>
    <p class="sub">$29.99 · Enter your license key to unlock.</p>
    <div class="row">
      <input id="key" placeholder="BLANKP-XXXX-XXXX-XXXX" style="flex:1;min-width:0" />
      <button id="activate">Activate</button>
    </div>
    <div class="row" style="margin-top:10px">
      <a class="btn ghost" href="/downloads/blank-premium-utility/BlankPremiumUtility-Setup.zip">Download</a>
    </div>
    <div id="status" class="status">Waiting for key…</div>
  </div>
  <script>
    const status = document.getElementById("status");
    document.getElementById("activate").onclick = async () => {
      const key = document.getElementById("key").value.trim();
      status.className = "status";
      status.textContent = "Checking…";
      try {
        const res = await fetch("/api/keys/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key }),
        });
        const data = await res.json();
        if (data.valid && data.productId === "blank-premium-utility") {
          status.className = "status ok";
          status.textContent = "ACTIVATED\nProduct: Blank Premium Utility\nKey status: " + data.status + "\n\n(Replace this test UI with your real Electron app build.)";
        } else if (data.valid) {
          status.className = "status bad";
          status.textContent = "Key is valid, but for a different product: " + data.productId;
        } else {
          status.className = "status bad";
          status.textContent = "Invalid / revoked key.\n" + JSON.stringify(data, null, 2);
        }
      } catch (e) {
        status.className = "status bad";
        status.textContent = String(e);
      }
    };
  </script>
</body>
</html>
